<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app_title">Transfer Yönetim Sistemi</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/i18n.js"></script>
  </head>
  <body class="driver-theme">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-brand">
          <span class="brand-icon">🚐</span> <span data-i18n="driver_panel">Sürücü Paneli</span>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" id="lang-switch"></div>
          <span id="who" class="who"></span>
          <button id="logout" class="btn btn-ghost btn-sm" type="button" data-i18n="logout">Çıkış</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="driver-head">
        <div class="filters" id="filters">
          <button class="chip active" data-filter="all" type="button" data-i18n="filter_all">Tümü</button>
          <button class="chip" data-filter="upcoming" type="button" data-i18n="filter_upcoming">Yaklaşan</button>
          <button class="chip" data-filter="completed" type="button" data-i18n="filter_completed">Tamamlanan</button>
        </div>
        <div class="driver-head-right">
          <div class="view-switch" id="view-switch">
            <button class="view-btn" data-view="list" type="button" data-i18n="view_list">Liste</button>
            <button class="view-btn" data-view="cards" type="button" data-i18n="view_cards">Kart</button>
          </div>
          <div class="pending-badge">
            <span data-i18n="pending_badge">Bekleyen</span>
            <span id="pending-count" class="pending-num">0</span>
          </div>
        </div>
      </div>

      <div id="cards" class="cards"></div>
      <p id="empty" class="empty hidden" data-i18n="empty_driver">Bu görünümde transfer yok.</p>
    </main>

    <script>
      const cardsEl = document.getElementById('cards');
      const emptyEl = document.getElementById('empty');
      const pendingCountEl = document.getElementById('pending-count');
      const filtersEl = document.getElementById('filters');
      const viewSwitch = document.getElementById('view-switch');
      const whoEl = document.getElementById('who');

      let allTransfers = [];
      let currentFilter = 'all';
      let viewMode = localStorage.getItem('tms_driver_view') || 'cards';

      function todayStr() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      }
      function matchesFilter(t, filter) {
        const datePart = (t.arrival_datetime || '').slice(0, 10);
        switch (filter) {
          case 'upcoming':
            // Tüm gelecek (bugün ve sonrası) tamamlanmamış yolcular.
            return datePart >= todayStr() && t.status !== 'completed';
          case 'completed':
            return t.status === 'completed';
          case 'all':
          default:
            return true;
        }
      }

      // Bir transferin geliş/gidiş zamanlarına göre yaşam döngüsü rengi (Tümü görünümü):
      //  - yeşil   (lc-upcoming): geliş henüz gerçekleşmemiş (ikisi de gerçekleşmeyen)
      //  - sarı    (lc-arrived):  geliş gerçekleşmiş, gidiş gerçekleşmemiş (sadece gelen)
      //  - kırmızı (lc-departed): hem geliş hem gidiş gerçekleşmiş (gelen giden)
      function lifecycleClass(t) {
        const now = Date.now();
        const arr = t.arrival_datetime ? new Date(t.arrival_datetime).getTime() : NaN;
        const dep = t.departure_datetime ? new Date(t.departure_datetime).getTime() : NaN;
        const arrivalPassed = !isNaN(arr) && arr <= now;
        const departurePassed = !isNaN(dep) && dep <= now;
        if (arrivalPassed && departurePassed) return 'lc-departed';
        if (arrivalPassed) return 'lc-arrived';
        return 'lc-upcoming';
      }

      // --- shared pieces ---
      function field(label, value) {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        const l = document.createElement('span');
        l.className = 'field-label';
        l.textContent = label;
        const v = document.createElement('span');
        v.className = 'field-value';
        v.textContent = value == null || value === '' ? '—' : value;
        wrap.append(l, v);
        return wrap;
      }
      function badge(status) {
        const b = document.createElement('span');
        b.className = 'badge ' + (status === 'completed' ? 'badge-done' : 'badge-pending');
        b.textContent = status === 'completed' ? i18n.t('status_completed') : i18n.t('status_pending');
        return b;
      }
      function callLink(phone) {
        const a = document.createElement('a');
        a.className = 'btn btn-sm btn-ghost';
        a.href = 'tel:' + phone;
        a.textContent = i18n.t('call');
        return a;
      }
      function toggleBtn(t) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn btn-sm ' + (t.status === 'completed' ? 'btn-ghost' : 'btn-success');
        b.textContent = t.status === 'completed' ? i18n.t('mark_pending') : i18n.t('mark_done');
        b.addEventListener('click', () => toggleComplete(t.id));
        return b;
      }

      // Group transfers that belong to the same booking (same group_id) so a
      // trip's passengers are shown together. Older rows (no group_id) stay solo.
      function groupTransfers(list) {
        const map = new Map();
        const order = [];
        for (const t of list) {
          const key = t.group_id ? 'g:' + t.group_id : 's:' + t.id;
          if (!map.has(key)) {
            map.set(key, []);
            order.push(key);
          }
          map.get(key).push(t);
        }
        return order.map((k) => map.get(k));
      }
      function countPill(n) {
        const s = document.createElement('span');
        s.className = 'pax-count';
        s.textContent = '👤 ' + n;
        return s;
      }
      // One passenger inside a grouped trip: name + phone, own status + actions.
      function paxRow(t) {
        const row = document.createElement('div');
        row.className = 'pax-row ' + (t.status === 'completed' ? 'is-done' : 'is-pending');
        const info = document.createElement('div');
        info.className = 'pax-info';
        const name = document.createElement('span');
        name.className = 'pax-name';
        name.textContent = t.passenger_name;
        info.appendChild(name);
        if (t.phone) {
          const ph = document.createElement('span');
          ph.className = 'pax-phone';
          ph.textContent = t.phone;
          info.appendChild(ph);
        }
        const actions = document.createElement('div');
        actions.className = 'pax-actions';
        actions.appendChild(badge(t.status));
        if (t.phone) actions.appendChild(callLink(t.phone));
        actions.appendChild(toggleBtn(t));
        row.append(info, actions);
        return row;
      }

      // --- card view ---
      function card(t) {
        const c = document.createElement('article');
        c.className = 'transfer-card ' + (t.status === 'completed' ? 'is-done' : 'is-pending');
        const head = document.createElement('div');
        head.className = 'tc-head';
        const flight = document.createElement('span');
        flight.className = 'tc-flight';
        flight.textContent = t.flight_code;
        const hotel = document.createElement('span');
        hotel.className = 'tc-hotel';
        hotel.textContent = t.hotel_name;
        head.append(flight, hotel);
        const name = document.createElement('div');
        name.className = 'tc-name';
        name.textContent = t.passenger_name;
        const grid = document.createElement('div');
        grid.className = 'tc-grid';
        grid.append(
          field(i18n.t('arrival_short'), i18n.fmtDateTime(t.arrival_datetime)),
          field(i18n.t('departure_short'), i18n.fmtDateTime(t.departure_datetime)),
          field(i18n.t('col_phone'), t.phone)
        );
        if (t.notes) grid.append(field(i18n.t('col_notes'), t.notes));
        const foot = document.createElement('div');
        foot.className = 'tc-foot';
        foot.append(badge(t.status));
        if (t.phone) foot.append(callLink(t.phone));
        foot.append(toggleBtn(t));
        c.append(head, name, grid, foot);
        return c;
      }

      // Card for a whole booking: shared flight/hotel/times + a passenger list.
      function groupCard(group) {
        const lead = group[0];
        const allDone = group.every((t) => t.status === 'completed');
        const c = document.createElement('article');
        c.className = 'transfer-card ' + (allDone ? 'is-done' : 'is-pending');
        const head = document.createElement('div');
        head.className = 'tc-head';
        const left = document.createElement('div');
        left.className = 'tc-head-left';
        const flight = document.createElement('span');
        flight.className = 'tc-flight';
        flight.textContent = lead.flight_code;
        left.append(flight, countPill(group.length));
        const hotel = document.createElement('span');
        hotel.className = 'tc-hotel';
        hotel.textContent = lead.hotel_name;
        head.append(left, hotel);
        const grid = document.createElement('div');
        grid.className = 'tc-grid';
        grid.append(
          field(i18n.t('arrival_short'), i18n.fmtDateTime(lead.arrival_datetime)),
          field(i18n.t('departure_short'), i18n.fmtDateTime(lead.departure_datetime))
        );
        if (lead.notes) grid.append(field(i18n.t('col_notes'), lead.notes));
        const pax = document.createElement('div');
        pax.className = 'tc-pax';
        for (const t of group) pax.appendChild(paxRow(t));
        c.append(head, grid, pax);
        return c;
      }

      // --- list (stacked) view ---
      function meta(label, value) {
        const wrap = document.createElement('div');
        wrap.className = 'lr-meta';
        const l = document.createElement('span');
        l.className = 'field-label';
        l.textContent = label;
        const v = document.createElement('span');
        v.textContent = value == null || value === '' ? '—' : value;
        wrap.append(l, v);
        return wrap;
      }
      function listRow(t) {
        const r = document.createElement('div');
        r.className = 'list-row ' + (t.status === 'completed' ? 'is-done' : 'is-pending');
        const flight = document.createElement('span');
        flight.className = 'lr-flight';
        flight.textContent = t.flight_code;
        const name = document.createElement('span');
        name.className = 'lr-name';
        name.textContent = t.passenger_name;
        const hotel = document.createElement('span');
        hotel.className = 'lr-hotel';
        hotel.textContent = t.hotel_name;
        r.append(flight, name, hotel, meta(i18n.t('arrival_short'), i18n.fmtDateTime(t.arrival_datetime)));
        if (t.departure_datetime) {
          r.append(meta(i18n.t('departure_short'), i18n.fmtDateTime(t.departure_datetime)));
        }
        r.append(meta(i18n.t('col_phone'), t.phone));
        const spacer = document.createElement('span');
        spacer.className = 'lr-spacer';
        const actions = document.createElement('div');
        actions.className = 'lr-actions';
        actions.append(badge(t.status));
        if (t.phone) actions.append(callLink(t.phone));
        actions.append(toggleBtn(t));
        r.append(spacer, actions);
        return r;
      }

      // List entry for a whole booking: shared header + stacked passenger rows.
      function groupRow(group) {
        const lead = group[0];
        const allDone = group.every((t) => t.status === 'completed');
        const wrap = document.createElement('div');
        wrap.className = 'list-group ' + (allDone ? 'is-done' : 'is-pending');
        const head = document.createElement('div');
        head.className = 'lg-head';
        const flight = document.createElement('span');
        flight.className = 'lr-flight';
        flight.textContent = lead.flight_code;
        const hotel = document.createElement('span');
        hotel.className = 'lr-hotel';
        hotel.textContent = lead.hotel_name;
        head.append(
          flight,
          hotel,
          countPill(group.length),
          meta(i18n.t('arrival_short'), i18n.fmtDateTime(lead.arrival_datetime))
        );
        if (lead.departure_datetime) {
          head.append(meta(i18n.t('departure_short'), i18n.fmtDateTime(lead.departure_datetime)));
        }
        const pax = document.createElement('div');
        pax.className = 'lg-pax';
        for (const t of group) pax.appendChild(paxRow(t));
        wrap.append(head, pax);
        return wrap;
      }

      function render() {
        const list = allTransfers.filter((t) => matchesFilter(t, currentFilter));
        cardsEl.replaceChildren();
        cardsEl.classList.toggle('as-list', viewMode === 'list');
        emptyEl.classList.toggle('hidden', list.length > 0);
        for (const group of groupTransfers(list)) {
          const single = group.length === 1;
          let el;
          if (viewMode === 'list') {
            el = single ? listRow(group[0]) : groupRow(group);
          } else {
            el = single ? card(group[0]) : groupCard(group);
          }
          // "Tümü" görünümünde kutuyu geliş/gidiş durumuna göre renklendir.
          if (currentFilter === 'all') el.classList.add(lifecycleClass(group[0]));
          cardsEl.appendChild(el);
        }
      }

      async function loadMe() {
        try {
          const res = await fetch('/api/me');
          if (res.ok) {
            const me = await res.json();
            whoEl.textContent = me.name || '';
          }
        } catch (e) {
          /* ignore */
        }
      }
      async function load() {
        const res = await fetch('/api/all-transfers');
        if (res.status === 401) {
          window.location.href = '/driver/login';
          return;
        }
        const data = await res.json();
        allTransfers = data.transfers || [];
        pendingCountEl.textContent =
          data.pending != null
            ? data.pending
            : allTransfers.filter((t) => t.status === 'pending').length;
        render();
      }
      async function toggleComplete(id) {
        const res = await fetch(`/driver/transfer/${id}/complete`, { method: 'POST' });
        if (res.status === 401) {
          window.location.href = '/driver/login';
          return;
        }
        if (res.ok) load();
      }

      // --- controls ---
      filtersEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        currentFilter = btn.dataset.filter;
        filtersEl.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c === btn));
        render();
      });

      function syncViewButtons() {
        viewSwitch
          .querySelectorAll('.view-btn')
          .forEach((b) => b.classList.toggle('active', b.dataset.view === viewMode));
      }
      viewSwitch.addEventListener('click', (e) => {
        const btn = e.target.closest('.view-btn');
        if (!btn) return;
        viewMode = btn.dataset.view;
        localStorage.setItem('tms_driver_view', viewMode);
        syncViewButtons();
        render();
      });

      document.getElementById('logout').addEventListener('click', async () => {
        await fetch('/logout', { method: 'POST' });
        window.location.href = '/driver/login';
      });

      window.addEventListener('langchange', render);

      syncViewButtons();
      loadMe();
      load();
    </script>
  </body>
</html>
